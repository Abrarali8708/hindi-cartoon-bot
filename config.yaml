# ---- Channel settings ----
channel_name: "Jhala TV"     # change to your channel's name (shown on title/ending cards)
privacy: "public"                     # use "private" for your first test runs
made_for_kids: false                  # family comedy for all ages (general audience)
ai_disclosure: false                  # cartoons aren't "realistic" AI media; the description still mentions AI
category_id: "1"                      # 1 = Film & Animation
ai_backgrounds: true                  # Cloudflare AI backgrounds (free); falls back to built-in drawings
music_volume: 0.07                    # put royalty-free .mp3 files in music/ (YouTube Audio Library)
short_max_seconds: 75
gemini_models: ["gemini-flash-lite-latest", "gemini-flash-latest", "gemini-2.5-flash-lite"]
