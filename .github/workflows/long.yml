name: Make and upload a long cartoon

on:
  schedule:
    - cron: "30 12 * * 0,1,3,5"   # Sun, Mon, Wed, Fri at 6:00 PM India
  workflow_dispatch:

permissions:
  contents: write

concurrency: cartoon-long

jobs:
  make:
    runs-on: ubuntu-latest
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - name: Install tools
        run: |
          sudo apt-get update -qq && sudo apt-get install -y -qq ffmpeg fonts-noto-core fonts-freefont-ttf
          pip install -r requirements.txt
      - name: Make and upload
        env:
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
          CF_ACCOUNT_ID: ${{ secrets.CF_ACCOUNT_ID }}
          CF_API_TOKEN: ${{ secrets.CF_API_TOKEN }}
          YT_CLIENT_ID: ${{ secrets.YT_CLIENT_ID }}
          YT_CLIENT_SECRET: ${{ secrets.YT_CLIENT_SECRET }}
          YT_REFRESH_TOKEN: ${{ secrets.YT_REFRESH_TOKEN }}
        run: python run.py long
      - name: Save log
        if: always()
        run: |
          git config user.name "cartoon-bot"
          git config user.email "cartoon-bot@users.noreply.github.com"
          git add data/history.json
          git commit -m "Log long" || exit 0
          for i in 1 2 3; do git pull --rebase -q && git push && break; sleep 5; done
      - name: Keep the video for 7 days
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: long
          path: |
            output/long/*.mp4
            output/long/*.jpg
            output/long/script.json
          retention-days: 7
          if-no-files-found: ignore
