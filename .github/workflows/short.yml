name: Make and upload a cartoon Short

on:
  schedule:
    - cron: "0 7 * * *"     # 12:30 PM India
    - cron: "0 14 * * *"    # 7:30 PM India
  workflow_dispatch:

permissions:
  contents: write

concurrency: cartoon-short

jobs:
  make:
    runs-on: ubuntu-24.04
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - name: Install tools
        timeout-minutes: 20
        run: |
          # Retry up to 3 times: GitHub's servers sometimes can't reach Ubuntu's package site for a few minutes
          for i in 1 2 3; do
            sudo timeout 300 apt-get -o Acquire::Retries=3 -o Acquire::http::Timeout=30 update -qq && \
            sudo timeout 600 apt-get -o Acquire::Retries=3 install -y -qq ffmpeg fonts-noto-core fonts-freefont-ttf && break
            if [ "$i" -eq 3 ]; then echo "Package install failed 3 times"; exit 1; fi
            echo "Package install failed (try $i), waiting 30 seconds..."; sleep 30
          done
          pip install -r requirements.txt
      - name: Make and upload
        env:
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
          CF_ACCOUNT_ID: ${{ secrets.CF_ACCOUNT_ID }}
          CF_API_TOKEN: ${{ secrets.CF_API_TOKEN }}
          YT_CLIENT_ID: ${{ secrets.YT_CLIENT_ID }}
          YT_CLIENT_SECRET: ${{ secrets.YT_CLIENT_SECRET }}
          YT_REFRESH_TOKEN: ${{ secrets.YT_REFRESH_TOKEN }}
        run: python run.py short
      - name: Save log
        if: always()
        run: |
          git config user.name "cartoon-bot"
          git config user.email "cartoon-bot@users.noreply.github.com"
          git add data/history.json
          git commit -m "Log short" || exit 0
          for i in 1 2 3; do git pull --rebase -q && git push && break; sleep 5; done
      - name: Keep the video for 7 days
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: short
          path: |
            output/short/*.mp4
            output/short/*.jpg
            output/short/script.json
          retention-days: 7
          if-no-files-found: ignore
